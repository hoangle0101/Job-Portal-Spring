# Load cấu hình cá nhân nếu có (được bảo vệ bởi .gitignore, an toàn tuyệt đối)
spring.config.import=optional:classpath:application-local.properties

# ---------------------------------------------
# APPLICATION CONFIGURATION
# ---------------------------------------------
spring.application.name=job_portal
server.port=8080

# ---------------------------------------------
# DATASOURCE (MYSQL) CONFIGURATION
# Cú pháp: ${TEN_BIEN_MOI_TRUONG:GIA_TRI_MAC_DINH}
# ---------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobPortal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ---------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------
# FILE UPLOAD CONFIGURATION
# ---------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads
